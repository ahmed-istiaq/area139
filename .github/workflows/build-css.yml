<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
// cursor + scroll line
const cx=$('#cx');
addEventListener('pointermove',e=>{cx.style.left=e.clientX+'px';cx.style.top=e.clientY+'px';cx.classList.toggle('on',!!e.target.closest('a,button,.im'))});
const sl=$('#sl');const up=()=>{sl.style.height=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%'};addEventListener('scroll',up,{passive:true});up();
// tickers
const t1=['Clinical Trainee','Systems','MediNote','Anatomy','Physiology','Biochemistry','Rangpur Medical College','Full-Stack'];
$('#tk1').innerHTML=[...t1,...t1,...t1].map(t=>`<span>${t}</span><span>✦</span>`).join('');
const t2=['Clinical Medicine','Computational Systems','MediNote','Anatomy','Biochemistry','Digital Health','Offline-First'];
$('#tk2').innerHTML=[...t2,...t2,...t2].map(t=>`<span>${t}</span><span>✦</span>`).join('');
// disciplines table with scramble hover
const U='https://ahmed-istiaq.github.io/area139/#section-';
const S=[['MBBS Books','Standard Atlases','mbbs-books/'],['Anatomy','Hand-Drawn Vector','anatomy'],['Physiology','Mechanistic Flow','physiology'],['Biochemistry','Pathway Matrix','biochemistry'],['Histology &amp; Rad','Slides &amp; Schematics','histo'],['Question Banks','Exam Question Sets','QB']];
$('#sv').innerHTML=S.map((r,i)=>`<a href="${U+r[2]}" target="_blank" rel="noopener noreferrer"><span class="n">${p2(i+1)}</span><span class="t">${r[0]}</span><span class="d">${r[1]}</span><span class="ar">↗</span></a>`).join('');
const CH='!<>-_\\/[]{}—=+*^?#';
function scr(el){const t=el.dataset.t||(el.dataset.t=el.textContent);clearInterval(el._i);let f=0;el._i=setInterval(()=>{el.textContent=[...t].map((c,i)=>c===' '?' ':(i<f/1.4?c:CH[Math.random()*CH.length|0])).join('');if(++f>t.length*1.4+2){clearInterval(el._i);el.textContent=t}},26)}
