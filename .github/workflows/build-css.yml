@keyframes gfloat{50%{translate:0 -9px}}
.gin{position:relative;z-index:1;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#141210;isolation:isolate;transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(#fff,#000);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
