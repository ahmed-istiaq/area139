.gcard.on .gf{border-color:rgba(255,255,255,.35);
 box-shadow:0 60px 90px -30px color-mix(in srgb,var(--cc1,#f0592a) 40%,transparent),0 36px 60px -18px rgba(0,0,0,.9),0 0 0 5px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.3);
 transform:perspective(1000px) rotateX(calc(var(--ty,0)*1deg)) rotateY(calc(var(--tx,0)*1deg));animation:gfloat 6s ease-in-out infinite}
