/* ---------- validate + upload ---------- */
function validate(){
 clearAll();let bad=null;
 if(!file){fErr('fFile','Please choose an image to upload.');bad=bad||dz}
 if(iTitle.value.trim().length<2){fErr('fTitle','Title is required (min 2 characters).');bad=bad||iTitle}
 if(iCat.value.trim().length<2){fErr('fCat','Pick or type a category.');bad=bad||iCat}
 if(bad){(bad===dz?fi:bad).focus({preventScroll:false});shake()}
 return !bad}
function prog(v,txt){pgi.style.width=v+'%';if(txt!==undefined)pt.textContent=txt}
function resetForm(){
 form.reset();dropFile();clearAll();syncPv();setErr(errUp,'');
 qa('#aSeg label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
 pg.classList.remove('on');prog(0,'')}

// raw XHR upload to Supabase Storage so we get real progress events
function xhrUpload(path,tok){
 return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();
  x.open('POST',ADMIN.supabase.url.replace(/\/$/,'')+'/storage/v1/object/'+ADMIN.bucket+'/'+path.split('/').map(encodeURIComponent).join('/'));
  x.setRequestHeader('Authorization','Bearer '+tok);x.setRequestHeader('apikey',ADMIN.supabase.anonKey);
  x.setRequestHeader('x-upsert','false');x.setRequestHeader('Content-Type',file.type);
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);prog(Math.round(p*.9),'Uploading… '+p+'%')}};
  x.onload=()=>{
   if(x.status>=200&&x.status<300)return res();
   rej({code:x.status===401||x.status===403||/row-level|unauthorized/i.test(x.responseText)?'perm':'http'})};
  x.onerror=()=>rej({code:'net'});
  x.send(file)})}

async function submit(e){
 e.preventDefault();if(busy||!user)return;
 setErr(errUp,'');if(!validate())return;
 busy=true;goBtn.classList.add('ld');pg.classList.add('on');prog(4,'Preparing…');
 const meta={
  title:iTitle.value.trim(),category:iCat.value.trim(),description:iDesc.value.trim(),
  alt:iAlt.value.trim()||iTitle.value.trim(),
  position:(q('#aSeg input:checked')||{}).value||'start',published:iPub.checked};
 try{
  if(!LIVE){
   for(const [v,t] of [[24,'Uploading…'],[58,'Uploading…'],[86,'Saving details…'],[100,'Done']]){await wait(480);prog(v,t)}
  }else{
   const c=await loadSB();
   const sd=await c.auth.getSession(),tok=sd.data&&sd.data.session&&sd.data.session.access_token;
   if(!tok)throw{code:'perm'};
   const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
   const slug=meta.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'image';
   const path=Date.now()+'-'+slug+'.'+ext;
   await xhrUpload(path,tok);
   prog(94,'Saving details…');
   const url=c.storage.from(ADMIN.bucket).getPublicUrl(path).data.publicUrl;
   const ins=await c.from(ADMIN.table).insert({title:meta.title,category:meta.category,description:meta.description,alt:meta.alt,image_url:url,storage_path:path,position:meta.position,published:meta.published,uploaded_by:user.email});
   if(ins.error){c.storage.from(ADMIN.bucket).remove([path]);throw ins.error}
   prog(100,'Done');fetchGallery(meta.position)}
  goBtn.classList.remove('ld');goBtn.classList.add('ok');
  toast(LIVE?'Image uploaded to Gallery':'Preview only · nothing was saved');
  await wait(1500);resetForm();goBtn.classList.remove('ok')
 }catch(err){
  goBtn.classList.remove('ld');pg.classList.remove('on');prog(0,'');
  const c=(err&&err.code)||'',m=(err&&err.message)||'';
  setErr(errUp,c==='42501'&&/permission denied for (table|function)/i.test(m)?'Database permission missing (GRANT). Run the GRANT SQL in ADMIN-SETUP.md.':c==='perm'||c==='42501'||/row-level/i.test(m)?'Permission denied. Check your Supabase RLS policies and admin email.':c==='net'?'Network error. Check your connection and try again.':'Upload failed. Please try again.');
  shake();toast('Upload failed',true)
 }finally{busy=false}}
form.addEventListener('submit',submit);

/* ---------- card manager (edit built-in + uploaded cards) ---------- */
const MG={items:[],ovr:{},sel:null,filter:'all',noOv:false,del:false,delT:0};
const pvOv={};   // preview-mode overrides (memory only)
const mList=q('#mgList'),mBox=q('#mgBox'),eForm=q('#eForm'),eEmpty=q('#eEmpty');
const eT=q('#eTitle'),eC=q('#eCat'),eD=q('#eDesc'),eA=q('#eAlt'),eP=q('#ePub');
const eGo=q('#eGo'),eDel=q('#eDel'),eRs=q('#eReset'),eEr=q('#eErr');
const cur=()=>MG.items.find(i=>i.key===MG.sel);
const note0=t=>{const d=document.createElement('div');d.className='a-note0';d.textContent=t;return d};

function buildItems(rows,ovr){
 const up=r=>({kind:'u',key:'u:'+r.id,id:r.id,title:r.title,category:r.category,description:r.description||'',alt:r.alt||'',published:!!r.published,position:r.position==='end'?'end':'start',img:r.image_url,path:r.storage_path,created:r.created_at});
 const bi=g=>{const o=ovr[g[0]];return{kind:'b',key:'b:'+g[0],id:g[0],title:(o&&o.title)||g[3],category:(o&&o.category)||g[2],description:o&&o.description!=null?o.description:g[4],alt:(o&&o.alt)||'',published:!(o&&o.hidden),hasOv:!!o,img:'Assets/'+g[0]+'.jpg'}};
 const st=rows.filter(r=>r.position!=='end').map(up),en=rows.filter(r=>r.position==='end').reverse().map(up);
 return[...st,...G0.map(bi),...en]}

function renderList(){
 mList.innerHTML='';
 const vis=MG.items.filter(i=>MG.filter==='all'||i.kind===MG.filter);
 q('#mgCount').textContent=vis.length+' / '+MG.items.length;
 if(!vis.length){mList.appendChild(note0('No cards here yet.'));return}
 vis.forEach(it=>{
  const b=document.createElement('button');b.type='button';b.dataset.k=it.key;
  b.className='a-ci'+(MG.sel===it.key?' on':'')+(it.published?'':' off');
  const im=document.createElement('img');im.src=it.img;im.alt='';im.loading='lazy';
  const m=document.createElement('span');m.className='cm';
  const t=document.createElement('b');t.textContent=it.title;
  const c=document.createElement('small');c.textContent=it.category;
  const tg=document.createElement('span');tg.className='ct';
  const tag=(txt,cls)=>{const i=document.createElement('i');i.className='tg'+(cls?' '+cls:'');i.textContent=txt;tg.appendChild(i)};
  tag(it.kind==='b'?'Built-in':'Uploaded');
  if(!it.published)tag(it.kind==='b'?'Hidden':'Draft','w');
  if(it.hasOv)tag('Edited','e');
  m.append(t,c,tg);b.append(im,m);mList.appendChild(b)})}

function chipSync(){qa('#eChips .a-chip').forEach(b=>b.classList.toggle('on',b.textContent.trim().toLowerCase()===eC.value.trim().toLowerCase()))}
function fillEditor(){
 const it=cur();
 eForm.style.display=it?'':'none';eEmpty.style.display=it?'none':'';
 if(!it)return;
 setErr(eEr,'');fErr('xTitle','');fErr('xCat','');
 q('#eImg').src=it.img;
 q('#eKind').textContent=it.kind==='b'?'Built-in card':'Uploaded card';
 q('#eName').textContent=it.kind==='b'?'Assets/'+it.id+'.jpg':(it.created?new Date(it.created).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'');
 eT.value=it.title;eC.value=it.category;eD.value=it.description;eA.value=it.alt;eP.checked=it.published;
 q('#eCnt').textContent=eD.value.length+'/160';chipSync();
 q('#eSwT').textContent=it.kind==='b'?'Show in gallery':'Published';
 q('#eSwS').textContent=it.kind==='b'?'Turn off to hide this card from the public gallery':'Turn off to keep it as a draft';
 q('#eSegW').style.display=it.kind==='u'?'':'none';
 qa('#eSeg input').forEach(r=>{r.checked=r.value===(it.position||'start')});
 qa('#eSeg label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
 eDel.style.display=it.kind==='u'?'':'none';eRs.style.display=it.kind==='b'&&it.hasOv?'':'none';
 resetDel();q('#eNoteT').textContent='card_overrides could not be read ('+MG.ovErr+'), so built-in cards cannot be saved yet. Run the table + GRANT SQL in ADMIN-SETUP.md.';q('#eNote').classList.toggle('on',it.kind==='b'&&MG.noOv&&LIVE)}
function resetDel(){MG.del=false;clearTimeout(MG.delT);eDel.textContent='Delete'}
function selectCard(k){
 MG.sel=k;resetDel();renderList();fillEditor();
 mBox.classList.add('ed');ov.scrollTop=0}

async function loadManage(){
 mList.innerHTML='';mList.appendChild(note0('Loading cards…'));
 try{
  let rows=[],ovr={};MG.noOv=false;
  if(LIVE){
   const c=await loadSB();
   const [g,o]=await Promise.all([c.from(ADMIN.table).select('*').order('created_at',{ascending:false}),c.from('card_overrides').select('*')]);
   if(g.error)throw g.error;
   rows=g.data||[];
   if(o.error){MG.noOv=true;MG.ovErr=o.error.code||o.error.message||'error'}else(o.data||[]).forEach(x=>{ovr[x.card_key]=x})
  }else ovr=pvOv;
  MG.ovr=ovr;MG.items=buildItems(rows,ovr)
 }catch(e){mList.innerHTML='';mList.appendChild(note0('Could not load cards'+(e&&(e.code||e.message)?' ('+[e.code,e.message].filter(Boolean).join(': ')+')':'')+'. Check your connection, GRANTs and RLS policies.'));return}
 if(MG.sel&&!cur())MG.sel=null;
 renderList();fillEditor()}

function mErr(e){
 const c=(e&&e.code)||'',m=(e&&e.message)||'';
 if(c==='42501'&&/permission denied for (table|function)/i.test(m))return'Database permission missing (GRANT). Run the GRANT SQL in ADMIN-SETUP.md.';
 if(c==='perm'||c==='42501'||/row-level/i.test(m))return'Permission denied. Check your Supabase RLS policies and admin email.';
 if(c==='PGRST205'||c==='42P01'||/card_overrides/i.test(m))return'The card_overrides table was not found. Run the SQL in ADMIN-SETUP.md.';
 if(c==='net'||/fetch|network/i.test(m))return'Network error. Check your connection and try again.';
 return'Something went wrong. Please try again.'}
async function afterChange(){
 if(LIVE){await loadManage();fetchGallery('keep',true)}
 else{MG.items=buildItems([],pvOv);renderList();fillEditor();window.rebuildGallery([],'keep',pvOv)}}

async function saveCard(ev){
 ev.preventDefault();const it=cur();if(!it||busy)return;
 setErr(eEr,'');fErr('xTitle','');fErr('xCat','');
 const v={title:eT.value.trim(),category:eC.value.trim(),description:eD.value.trim(),alt:eA.value.trim(),published:eP.checked,position:(q('#eSeg input:checked')||{}).value||'start'};
 let bad=null;
 if(v.title.length<2){fErr('xTitle','Title is required (min 2 characters).');bad=bad||eT}
 if(v.category.length<2){fErr('xCat','Pick or type a category.');bad=bad||eC}
 if(bad){bad.focus();shake();return}
 if(!MG.items.filter(x=>x.key===it.key?v.published:x.published).length){setErr(eEr,'At least one card must stay visible in the gallery.');shake();return}
 busy=true;eGo.classList.add('ld');
 try{
  if(!LIVE){
   await wait(500);
   if(it.kind==='b')pvOv[it.id]={card_key:it.id,title:v.title,category:v.category,description:v.description,alt:v.alt||null,hidden:!v.published}
  }else{
   const c=await loadSB();
   if(it.kind==='u'){
    const r=await c.from(ADMIN.table).update({title:v.title,category:v.category,description:v.description,alt:v.alt||v.title,published:v.published,position:v.position}).eq('id',it.id).select('id');
    if(r.error)throw r.error;if(!r.data||!r.data.length)throw{code:'perm'}
   }else{
    const r=await c.from('card_overrides').upsert({card_key:it.id,title:v.title,category:v.category,description:v.description,alt:v.alt||null,hidden:!v.published,updated_at:new Date().toISOString()},{onConflict:'card_key'}).select('card_key');
    if(r.error)throw r.error;if(!r.data||!r.data.length)throw{code:'perm'}
   }
  }
  eGo.classList.remove('ld');eGo.classList.add('ok');
  toast(LIVE?'Card updated':'Preview only · nothing was saved');
  await afterChange();await wait(1100);eGo.classList.remove('ok')
 }catch(e){
  eGo.classList.remove('ld');setErr(eEr,mErr(e));shake();toast('Could not save',true)
 }finally{busy=false}}

async function deleteCard(){
 const it=cur();if(!it||it.kind!=='u'||busy)return;
 if(!MG.del){MG.del=true;eDel.textContent='Tap again to delete';MG.delT=setTimeout(resetDel,3500);return}
 resetDel();busy=true;eDel.disabled=true;setErr(eEr,'');
 try{
  const c=await loadSB();
  const r=await c.from(ADMIN.table).delete().eq('id',it.id).select('id');
  if(r.error)throw r.error;if(!r.data||!r.data.length)throw{code:'perm'}
  if(it.path)c.storage.from(ADMIN.bucket).remove([it.path]);
  toast('Card deleted');MG.sel=null;mBox.classList.remove('ed');await afterChange()
 }catch(e){setErr(eEr,mErr(e));shake();toast('Could not delete',true)}
 finally{busy=false;eDel.disabled=false}}

async function resetCard(){
 const it=cur();if(!it||it.kind!=='b'||busy)return;
 busy=true;eRs.disabled=true;setErr(eEr,'');
 try{
  if(!LIVE){await wait(300);delete pvOv[it.id]}
  else{const c=await loadSB();const r=await c.from('card_overrides').delete().eq('card_key',it.id);if(r.error)throw r.error}
  toast('Restored to original');await afterChange()
 }catch(e){setErr(eEr,mErr(e));shake()}
 finally{busy=false;eRs.disabled=false}}

