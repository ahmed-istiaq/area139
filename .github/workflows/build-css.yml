.a-box{position:relative;z-index:1;margin:auto;width:100%;max-width:440px;padding:30px 30px 26px;border:1px solid rgba(255,255,255,.14);border-radius:22px;
 background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 45%),rgba(17,15,13,.92);
 box-shadow:0 70px 110px -44px rgba(240,89,42,.38),0 34px 60px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08);
 opacity:0;filter:blur(10px);transform:translateY(30px) scale(.97);outline:0;
 transition:opacity .45s,filter .45s,transform .6s cubic-bezier(.2,.8,.2,1),max-width .75s cubic-bezier(.7,0,.2,1)}
html.ao .a-box{opacity:1;filter:none;transform:none;transition:opacity .7s .1s,filter .7s .1s,transform .9s .1s cubic-bezier(.2,.8,.2,1),max-width .75s cubic-bezier(.7,0,.2,1)}
.a-box.wide{max-width:1020px}
.a-box::before{content:"";position:absolute;left:30px;right:30px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--or),transparent)}
.a-box.shake{animation:ashake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes ashake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes aspin{to{transform:rotate(360deg)}}
.a-v{display:none}
.a-v.on{display:block;animation:ain .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ain{from{opacity:0;filter:blur(8px);transform:translateY(12px)}}

.a-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.a-eb{display:inline-flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);min-width:0}
.a-tr{display:flex;align-items:center;gap:8px;flex:none}
.a-cl{position:relative;width:40px;height:40px;flex:none;padding:0;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.05);-webkit-tap-highlight-color:transparent;transition:border-color .3s,background .3s,transform .3s}
.a-cl i{position:absolute;left:11px;top:18px;width:16px;height:2px;border-radius:2px;background:var(--tx);transition:background .3s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.a-cl i:nth-child(1){transform:rotate(45deg)}.a-cl i:nth-child(2){transform:rotate(-45deg)}
.a-cl:hover{border-color:rgba(240,89,42,.6);background:rgba(240,89,42,.14)}
.a-cl:hover i{background:var(--or)}.a-cl:hover i:nth-child(1){transform:rotate(135deg)}.a-cl:hover i:nth-child(2){transform:rotate(45deg)}
.a-cl:active{transform:scale(.9)}
.btn.a-so{height:40px;padding:0 14px;font-size:10px;border-radius:12px}
.btn.a-so .a-ic{width:14px;height:14px}
.a-t{font-size:clamp(2rem,7vw,3rem);margin-bottom:14px}
.a-t span{display:block}
.a-p{color:#9b948c;font-size:12.5px;margin-bottom:24px;max-width:52ch}
.a-p b{font-weight:800}
.a-us{display:inline-flex;align-items:center;gap:10px;max-width:100%;margin:-6px 0 24px;padding:7px 14px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.03);font-size:10.5px;letter-spacing:.08em;color:#a49d95}
.a-us .dot{background:#3ddc84;flex:none}
.a-us b{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.a-er{display:none;margin-bottom:16px;padding:11px 14px;border:1px solid rgba(255,107,107,.45);border-radius:12px;background:rgba(255,107,107,.08);color:#ff9a9a;font-size:11.5px;line-height:1.55}
.a-er.on{display:block;animation:ain .5s cubic-bezier(.2,.8,.2,1) both}
.a-f{display:block;margin-bottom:16px;min-width:0}
.a-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.a-l b{font-weight:800;color:var(--or)}
.a-l small{font-size:10px;letter-spacing:.08em;color:#6a645d;text-transform:none}
.a-in{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:rgba(255,255,255,.04);transition:border-color .3s,background .3s,box-shadow .35s}
.a-in>.a-ic{width:15px;height:15px;stroke-width:1.8;color:var(--mu);transition:color .3s}
.a-in:hover{border-color:rgba(255,255,255,.22)}
.a-in:focus-within{border-color:rgba(240,89,42,.65);background:rgba(240,89,42,.06);box-shadow:0 0 0 4px rgba(240,89,42,.1),0 16px 28px -18px rgba(240,89,42,.75)}
.a-in:focus-within>.a-ic{color:var(--or)}
.a-in input,.a-in textarea{flex:1;min-width:0;width:100%;padding:14px 0;border:0;border-radius:0;outline:0;background:transparent;color:var(--tx);font:500 13px/1.5 'JetBrains Mono',ui-monospace,monospace;-webkit-appearance:none;appearance:none}
.a-in textarea{display:block;min-height:96px;padding:13px 0;resize:none}
.a-in.ta{align-items:flex-start}.a-in.ta>.a-ic{margin-top:16px}
.a-in ::placeholder{color:#5f5a54;opacity:1}
.a-in input:-webkit-autofill{-webkit-text-fill-color:var(--tx);caret-color:var(--tx);box-shadow:0 0 0 100px #1b1713 inset;transition:background-color 9999s}
.a-f.err .a-in{border-color:#ff6b6b;background:rgba(255,107,107,.06)}
.a-f.err .a-in>.a-ic{color:#ff6b6b}
.a-m{display:block;max-height:0;overflow:hidden;opacity:0;font-style:normal;font-size:11px;line-height:1.5;color:#ff8a8a;transition:max-height .3s,opacity .3s,margin .3s}
.a-f.err .a-m{max-height:44px;opacity:1;margin-top:7px}
.a-r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.a-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.a-chip{padding:5px 11px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.03);color:var(--mu);font:500 10px/1.5 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;transition:border-color .25s,color .25s,background .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.a-chip:hover{border-color:rgba(240,89,42,.55);color:var(--or);transform:translateY(-1px)}
.a-chip.on{border-color:var(--or);background:rgba(240,89,42,.14);color:var(--or)}

.a-dz{position:relative;padding:24px 18px;border:1.5px dashed rgba(255,255,255,.2);border-radius:16px;background:rgba(255,255,255,.03);text-align:center;overflow:hidden;transition:border-color .3s,background .3s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.a-dz:hover,.a-dz.drag,.a-dz:focus-within{border-color:var(--or);background:rgba(240,89,42,.07);box-shadow:0 18px 34px -22px rgba(240,89,42,.8)}
.a-dz.drag{transform:scale(1.015)}
.a-dz input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;font-size:0}
.a-dz.has{border-style:solid;padding:14px}
.a-dz.has input{pointer-events:none}
.a-de{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.a-dz.has .a-de{display:none}
.a-ud{display:grid;place-items:center;width:46px;height:46px;margin-bottom:6px;border:1px solid rgba(240,89,42,.45);border-radius:50%;background:rgba(240,89,42,.1);color:var(--or);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.a-ud .a-ic{width:20px;height:20px}
.a-dz:hover .a-ud,.a-dz.drag .a-ud{transform:translateY(-4px) scale(1.08)}
.a-de b{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.a-de u{color:var(--or);text-underline-offset:3px}
.a-de small{font-size:10.5px;color:var(--mu)}
.a-df{display:none;align-items:center;gap:14px;text-align:left}
.a-dz.has .a-df{display:flex}
.a-th{width:56px;height:74px;flex:none;border:1px solid var(--ln);border-radius:10px;object-fit:cover;background:#141210}
.a-fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.a-fm b{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-fm small{font-size:10.5px;color:var(--mu)}
.a-fm em{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--or)}
.a-rm{position:relative;z-index:2;display:grid;place-items:center;flex:none;width:36px;height:36px;padding:0;border:1px solid var(--ln);border-radius:10px;background:rgba(255,255,255,.05);color:var(--tx);transition:border-color .3s,background .3s,color .3s}
.a-rm:hover{border-color:#ff6b6b;background:rgba(255,107,107,.12);color:#ff6b6b}

.a-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--ln);border-radius:12px;background:rgba(255,255,255,.04)}
.a-seg label{position:relative;display:block;padding:10px 6px;border-radius:9px;text-align:center;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);transition:color .25s,background .25s}
.a-seg label:hover{color:var(--tx)}
.a-seg label.on{background:var(--or);color:#0b0a09;font-weight:800}
.a-seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.a-seg label:focus-within{outline:2px solid var(--or);outline-offset:2px}
.a-sw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:rgba(255,255,255,.04)}
.a-sw span{min-width:0}
.a-sw b{display:block;font-size:12px;font-weight:700}
.a-sw small{display:block;font-size:10.5px;color:var(--mu)}
.a-sw input{position:absolute;opacity:0;width:1px;height:1px}
.a-sw i{position:relative;flex:none;width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);transition:background .3s}
.a-sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--tx);transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s}
.a-sw input:checked+i{background:var(--or)}
.a-sw input:checked+i::after{transform:translateX(20px);background:#0b0a09}
.a-sw input:focus-visible+i{outline:2px solid var(--or);outline-offset:3px}

.a-pg{height:2px;margin-top:4px;background:var(--ln);overflow:hidden;opacity:0;transition:opacity .3s}
.a-pg.on{opacity:1}
.a-pg i{display:block;width:0;height:100%;background:var(--or);box-shadow:0 0 12px var(--or);transition:width .2s linear}
.a-pt{min-height:18px;margin:8px 0 6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.a-ac{display:flex;gap:10px}
.a-ac .btn{border-radius:14px;padding:17px 22px}
.a-go{position:relative;flex:1}
.a-go .bl{display:inline-flex;align-items:center;gap:8px;transition:opacity .25s}
.a-go .bl i{font-style:normal;font-size:15px;transition:transform .35s}
.a-go:hover .bl i{transform:translate(2px,-2px)}
.a-go .bs,.a-go .bk{position:absolute;left:50%;top:50%;opacity:0;transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.a-go .bs{width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(11,10,9,.25);border-top-color:#0b0a09;border-radius:50%;animation:aspin .7s linear infinite}
.a-go .bk{width:22px;height:22px;margin:-11px 0 0 -11px;stroke:#0b0a09;stroke-width:3;transform:scale(.4)}
.a-go.ld .bl,.a-go.ok .bl{opacity:0}
.a-go.ld .bs{opacity:1}
.a-go.ok .bk{opacity:1;transform:none}
.a-go.ld,.a-go.ok{pointer-events:none}
.a-note{margin-top:14px;font-size:10.5px;color:var(--mu)}
.a-ft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--ln);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.a-ft span{display:inline-flex;align-items:center;gap:8px}

.a-g{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:start}
.a-pvw{position:sticky;top:0;min-width:0}
.a-pvh{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.a-pf{position:relative;max-width:300px;margin:0 auto;padding:6px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.04));box-shadow:0 34px 60px -22px rgba(0,0,0,.9),0 40px 80px -40px rgba(240,89,42,.45)}
.a-pi{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#141210}
.a-pi img{display:none;width:100%;height:100%;object-fit:cover}
.a-pi.has img{display:block}
.a-pi::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(transparent 55%,rgba(0,0,0,.5))}
.a-pi .ph0{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mu);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 38px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 38px)}
.a-pi.has .ph0{display:none}
.a-pi .ph0 .a-ic{width:26px;height:26px;stroke-width:1.5}
.a-pi .pn,.a-pi .pg2{position:absolute;top:10px;z-index:3;padding:5px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(10,10,12,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.a-pi .pn{left:10px;background:rgba(240,89,42,.75)}
.a-pi .pg2{right:10px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-pc{max-width:300px;margin:18px auto 0;text-align:center}
.a-pc small{display:block;margin-bottom:8px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.a-pc h3{margin-bottom:8px;font-size:1.1rem;font-weight:800;line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere}
.a-pc p{font-size:12px;color:#a29b92;overflow-wrap:anywhere}
.a-pc .is-ph{color:#5f5a54}


/* google sign-in */
.btn.a-gg{position:relative;width:100%;gap:14px;padding:17px 22px;border-radius:14px;background:var(--tx);border-color:var(--tx);color:#0b0a09;font-size:11.5px}
.btn.a-gg:hover{background:var(--or);border-color:var(--or)}
.a-gg .gl2{width:20px;height:20px;flex:none;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.a-gg:hover .gl2{transform:rotate(-10deg) scale(1.12)}
.a-gg .bl{display:inline-flex;align-items:center;gap:14px;transition:opacity .25s}
.a-gg .bs{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(11,10,9,.25);border-top-color:#0b0a09;border-radius:50%;opacity:0;animation:aspin .7s linear infinite;transition:opacity .25s}
.a-gg.ld{pointer-events:none}
.a-gg.ld .bl{opacity:0}.a-gg.ld .bs{opacity:1}
.a-or{display:flex;align-items:center;gap:14px;margin:22px 0 18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.a-or::before,.a-or::after{content:"";flex:1;height:1px;background:var(--ln)}
.a-rules{display:grid;gap:8px;margin:0}
.a-rules li{position:relative;padding-left:22px;font-size:11.5px;color:#a49d95}
.a-rules li::before{content:"✓";position:absolute;left:0;color:var(--or)}
.a-mode{display:none;margin-top:16px;padding:10px 14px;border:1px dashed rgba(240,89,42,.45);border-radius:12px;background:rgba(240,89,42,.06);font-size:10.5px;line-height:1.6;color:#c9a592}
.a-mode.on{display:block}
.a-mode b{color:var(--or);font-weight:800}
/* ===== card manager ===== */
.a-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:380px;margin:-6px 0 24px;padding:4px;border:1px solid var(--ln);border-radius:12px;background:rgba(255,255,255,.04)}
.a-tab{padding:10px 8px;border:0;border-radius:9px;background:transparent;color:var(--mu);font:500 10.5px/1.2 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;-webkit-tap-highlight-color:transparent;transition:color .25s,background .25s}
.a-tab:hover{color:var(--tx)}
.a-tab.on{background:var(--or);color:#0b0a09;font-weight:800}
.a-tab:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.a-mg{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.a-mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.a-mh .a-chips{margin-top:0}
.a-mh>span{flex:none;font-size:10px;letter-spacing:.14em;color:var(--mu)}
.a-lst{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,640px);overflow-y:auto;padding-right:4px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3a3530 transparent}
.a-ci{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border:1px solid var(--ln);border-radius:14px;background:rgba(255,255,255,.03);color:var(--tx);text-align:left;font:inherit;-webkit-tap-highlight-color:transparent;transition:border-color .3s,background .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.a-ci:hover{border-color:rgba(240,89,42,.5);transform:translateX(2px)}
.a-ci.on{border-color:var(--or);background:rgba(240,89,42,.09);box-shadow:0 14px 28px -20px rgba(240,89,42,.9)}
.a-ci img{width:44px;height:58px;flex:none;border:1px solid var(--ln);border-radius:9px;object-fit:cover;background:#141210;transition:opacity .3s,filter .3s}
.a-ci.off img{opacity:.4;filter:grayscale(1)}
.a-ci .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.a-ci .cm b{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-ci .cm small{font-size:10.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-ci .ct{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tg{padding:2px 8px;border:1px solid var(--ln);border-radius:999px;font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.tg.w{border-color:rgba(255,107,107,.5);color:#ff8a8a}
.tg.e{border-color:rgba(240,89,42,.55);color:var(--or)}
.a-note0{padding:24px 14px;border:1px dashed var(--ln);border-radius:14px;text-align:center;font-size:11.5px;color:var(--mu)}
.a-me{min-width:0}
.a-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:52px 20px;border:1px dashed rgba(255,255,255,.18);border-radius:16px;text-align:center;font-size:12px;color:var(--mu)}
.a-empty .a-ic{width:26px;height:26px;stroke-width:1.5;color:var(--or)}
.a-back{display:none;align-items:center;gap:8px;margin-bottom:14px;padding:6px 0;border:0;background:transparent;color:var(--or);font:500 10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.a-eh{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:10px;border:1px solid var(--ln);border-radius:14px;background:rgba(255,255,255,.03)}
.a-eh img{width:52px;height:68px;flex:none;border:1px solid var(--ln);border-radius:10px;object-fit:cover;background:#141210}
.a-eh div{min-width:0;display:flex;flex-direction:column;gap:4px}
.a-eh small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
.a-eh b{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.a-del{border-color:rgba(255,107,107,.45);color:#ff8a8a}
.btn.a-del:hover{border-color:#ff6b6b;background:rgba(255,107,107,.14);color:#ff6b6b}
.a-warn{display:none;margin-bottom:16px;padding:10px 14px;border:1px dashed rgba(240,89,42,.45);border-radius:12px;background:rgba(240,89,42,.06);font-size:10.5px;line-height:1.6;color:#c9a592}
.a-warn.on{display:block}
.a-warn b{color:var(--or);font-weight:800}
@media(max-width:860px){.a-mg{grid-template-columns:1fr}.a-mg .a-me{display:none}.a-mg.ed .a-ml{display:none}.a-mg.ed .a-me{display:block}.a-back{display:inline-flex}.a-lst{max-height:none}}
