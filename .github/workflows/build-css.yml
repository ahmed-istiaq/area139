<style>
:root{--bg:#0b0a09;--tx:#f1ebe3;--or:#f0592a;--or2:#ff8a4c;--mu:#8a847d;--ln:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html.sm{scroll-behavior:auto}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
body{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.75;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}ul{list-style:none}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
@media(pointer:fine){body,a,button{cursor:none}}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.h{font-weight:800;text-transform:uppercase;line-height:1.02;letter-spacing:-.02em}
.ol{color:transparent;-webkit-text-stroke:1.5px var(--tx)}
.or{color:var(--or)}
.mu{color:var(--mu)}
.sec{padding:130px 0 0}
.sh{text-align:center;margin-bottom:70px}
.sh h2{font-size:clamp(2.2rem,7vw,5.6rem)}
.sh h2 span{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;font:800 11px/1 'JetBrains Mono';letter-spacing:.08em;text-transform:uppercase;background:var(--or);color:#0b0a09;border:1px solid var(--or);transition:.25s}
.btn:hover{background:var(--tx);border-color:var(--tx)}
.btn.g{background:transparent;color:var(--tx);border-color:var(--ln)}
.btn.g:hover{border-color:var(--or);color:var(--or)}
/* cursor + progress */
.cx{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;z-index:200;mix-blend-mode:difference;transition:transform .25s}
.cx::before,.cx::after{content:"";position:absolute;background:#fff}
.cx::before{left:12px;top:0;width:2px;height:26px}.cx::after{top:12px;left:0;height:2px;width:26px}
.cx.on{transform:scale(1.7) rotate(45deg)}
@media(pointer:coarse){.cx{display:none}}
.sl{position:fixed;left:0;top:0;width:2px;height:0;background:var(--tx);z-index:90}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:80;height:58px}
header::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--bg),rgba(11,10,9,.6));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.05);transition:opacity .4s .4s}
.bar{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative}
/* logo: wordmark image, transparent, soft glow on hover */
.logo,.fl{position:relative;display:block;transition:transform .5s cubic-bezier(.34,1.56,.64,1),filter .5s}
.logo img,.fl img{display:block;width:auto;height:100%;object-fit:contain}
.logo:hover,.fl:hover{transform:scale(1.07);filter:drop-shadow(0 0 12px rgba(240,89,42,.75))}
@keyframes lmspin{to{transform:rotate(360deg)}}
/* ===== unified hover: tint sweep + border glow + text scramble (same as MediNote disciplines) ===== */
.btn.g,.chip.c,.gflow,.gsq,.mms a,.mm .btn.g{background-image:linear-gradient(rgba(240,89,42,.14),rgba(240,89,42,.14));background-repeat:no-repeat;background-position:left;background-size:0% 100%;transition:background-size .45s cubic-bezier(.2,.8,.2,1),border-color .25s,color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.btn.g:hover,.chip.c:hover,.gflow:hover,.gsq:hover,.mms a:hover{background-size:100% 100%;border-color:rgba(240,89,42,.55);transform:translateY(-2px);box-shadow:0 12px 24px -14px rgba(240,89,42,.7)}
.btn:not(.g){transition:background .25s,border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.btn:not(.g):hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px rgba(240,89,42,.75)}
.fab:hover{box-shadow:0 16px 34px -8px rgba(240,89,42,.6)}
.more{position:relative;padding-bottom:4px;background-image:linear-gradient(var(--or),var(--or));background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:letter-spacing .25s,background-size .45s cubic-bezier(.2,.8,.2,1)}
.more:hover{background-size:100% 1px}
nav a,.ft a,.cr a,.mail{background-image:linear-gradient(var(--or),var(--or));background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px}
nav a,.ft a,.cr a{transition:color .2s,background-size .4s cubic-bezier(.2,.8,.2,1)}
nav a:hover,nav a.on,.ft a:hover,.cr a:hover{background-size:100% 1px}
.mail{transition:background-size .4s cubic-bezier(.2,.8,.2,1),border-color .2s}
.mail:hover{background-size:100% 1px}

.logo{height:34px}
nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:30px}
nav a{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a49d95;transition:.2s}
nav a:hover,nav a.on{color:var(--or)}
.rt{display:flex;gap:8px;align-items:center}
.chip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.chip.c{background:#171514}
.dot{width:6px;height:6px;border-radius:50%;background:var(--or);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 24px 90px;position:relative;overflow:hidden;
background:radial-gradient(70% 45% at 50% 105%,rgba(240,89,42,.28),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 150px)}
.hero h1{font-size:clamp(1.55rem,5.4vw,5rem)}
.hero h1 span{display:block}
.hero p{max-width:480px;margin:34px auto;color:#9b948c;font-size:13px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rv{opacity:0;filter:blur(10px);transform:translateY(18px);animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;filter:none;transform:none}}
.scr{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.2em;color:var(--mu)}
.scr b{font-size:26px;font-weight:400;color:var(--tx)}
.tick{border-block:1px solid var(--ln);overflow:hidden;white-space:nowrap;padding:8px 0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,89,42,.7)}
.tick div{display:inline-block;animation:mq 40s linear infinite}.tick span{margin:0 14px}
@keyframes mq{to{transform:translateX(-50%)}}
/* stats band */
.band{background:var(--or);color:#0b0a09}
.band .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-block:44px;text-align:center}
.band b{display:block;font-size:clamp(1.3rem,3.2vw,2.7rem);font-weight:800;line-height:1.1}
.band span{font-size:10px;letter-spacing:.08em;display:block;margin-top:8px;line-height:1.5}
/* about */
.ab{display:grid;grid-template-columns:5fr 7fr;gap:70px;align-items:center}
.ph{position:relative;border:1px solid var(--ln);aspect-ratio:4/5;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) contrast(1.05);transition:filter .7s,transform .7s}
.ph:hover img{filter:none;transform:scale(1.04)}
.ph::before,.ph::after{content:"";position:absolute;width:34px;height:34px;border:2px solid var(--or);z-index:2}
.ph::before{top:10px;left:10px;border-right:0;border-bottom:0}.ph::after{bottom:10px;right:10px;border-left:0;border-top:0}
.ph .tl{position:absolute;left:18px;top:18px;right:18px;display:flex;justify-content:space-between;z-index:3}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 20px;background:linear-gradient(transparent,rgba(0,0,0,.92));z-index:2}
.ph{transform:perspective(900px) rotateX(calc(var(--prx,0)*1deg)) rotateY(calc(var(--pry,0)*1deg));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s,border-color .5s;will-change:transform}
.ph.tilt{transition:transform .12s ease-out,box-shadow .5s,border-color .5s;box-shadow:0 40px 70px -30px rgba(240,89,42,.35),0 20px 40px -20px rgba(0,0,0,.8);border-color:rgba(240,89,42,.45)}
.ph .pgl{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.22),transparent 55%);mix-blend-mode:soft-light}
.ph.tilt .pgl{opacity:1}
.ph .cap b{font-size:16px;display:block}.ph .cap span{color:var(--or);font-size:12px}
.ab h2{font-size:clamp(2.2rem,5.4vw,4.6rem);margin:12px 0 26px}
.ab p{color:#a9a29a;max-width:560px;margin-bottom:28px}.ab p b{color:var(--tx)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln);margin-bottom:30px}
.kv div{background:var(--bg);padding:16px 18px}.kv small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.eb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
/* work list */
.ed{max-width:1000px;margin:0 auto}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;padding:64px 0;border-top:1px solid var(--ln)}
.wk:last-child{border-bottom:1px solid var(--ln)}
.wk.pre{opacity:0;transform:translateY(46px);filter:blur(8px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.wk.pre.in{opacity:1;transform:none;filter:none}
.num{font-size:clamp(2.2rem,4vw,3.4rem);font-weight:800;color:var(--or);line-height:1}
.wk h3{font-size:clamp(1.15rem,2vw,1.55rem);font-weight:800;margin:14px 0 6px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.wk .yr{font-size:11px;letter-spacing:.12em;color:var(--or);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.wk p{color:#8f8981;margin-bottom:20px;font-size:12.5px;max-width:400px}
.more{background:none;border:0;padding:0;font:500 11px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--or);transition:.25s}
.more:hover{letter-spacing:.2em}
.more span{display:inline-block;transition:transform .35s}
.wk.open .more span{transform:rotate(45deg)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
.xp>div{overflow:hidden}.xp>div>*:first-child{margin-top:22px}
.wk.open .xp{grid-template-rows:1fr}
.bgs{display:grid;gap:8px;margin-bottom:20px}
.bgs div{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);padding:10px 14px;font-size:12px;font-weight:500;line-height:1.35}
.bgs img{width:28px;height:28px;object-fit:contain;background:#fff;padding:2px}
.bgs small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.bgs i{color:var(--or);font-style:normal;font-size:16px}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg span{border:1px solid var(--ln);padding:4px 11px;font-size:11px;color:var(--mu)}
/* education image cards */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.im{position:relative;border:1px solid var(--ln);border-radius:18px;aspect-ratio:16/10;overflow:hidden;background:#141210;isolation:isolate;
 transform:perspective(1100px) rotateX(calc(var(--ix,0)*1deg)) rotateY(calc(var(--iy,0)*1deg));
 transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .7s,border-color .5s;will-change:transform;-webkit-tap-highlight-color:transparent}
.im.tl{transition:transform .12s ease-out,box-shadow .7s,border-color .5s}
.im img{width:100%;height:100%;object-fit:cover;filter:grayscale(.6) brightness(.78) contrast(1.05);transition:scale 1.1s cubic-bezier(.2,.8,.2,1),filter .8s}
.im::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s;
 background:radial-gradient(380px circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.22),rgba(240,89,42,.16) 38%,transparent 68%);mix-blend-mode:overlay}
.im::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .5s;
 background:conic-gradient(from var(--ang),transparent 0 55%,var(--or) 78%,var(--or2) 90%,transparent);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 animation:imspin 3.2s linear infinite}
@keyframes imspin{to{--ang:360deg}}
.im .imsc{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:1;transition:opacity .6s;background:linear-gradient(transparent 38%,rgba(11,10,9,.82))}
.im em{position:absolute;left:12px;top:12px;z-index:4;font:500 10px 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;font-style:normal;
 background:rgba(11,10,9,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;
 transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .4s,background .4s}
.im .imo{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:14px;
 background:rgba(18,16,14,.5);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.16);overflow:hidden;
 opacity:1;transform:none;transition:transform .9s cubic-bezier(.2,.8,.2,1) .55s,opacity .7s ease .55s,filter .8s ease .55s,box-shadow .5s,border-color .4s}
.wk.pre:not(.in) .imo{opacity:0;filter:blur(8px);transform:translateY(calc(100% + 24px)) scale(.94)}
.imo>*{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s}
.wk.pre:not(.in) .imo .imn,.wk.pre:not(.in) .imo .imt{opacity:0;transform:translateX(-14px)}
.wk.pre:not(.in) .imo .imb{opacity:0;transform:scale(.4) translateX(20px)}
.imo .imn{transition-delay:.85s}.imo .imt{transition-delay:.95s}.imo .imb{transition-delay:1.05s}
.imo::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.wk.in .imo::before{animation:imsh 1.5s cubic-bezier(.4,0,.2,1) 1.2s 1}
.im:hover .imo::before{animation:imsh 1s cubic-bezier(.4,0,.2,1) 1}
@keyframes imsh{to{transform:translateX(120%)}}
.imo .imn{color:var(--or);font-size:13px;font-weight:800}
.imo .imt{flex:1;min-width:0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imo .imb{position:relative;flex:none;height:34px;display:flex;align-items:center;gap:10px;padding:0 4px 0 14px;border-radius:999px;background:var(--or);color:#0b0a09;font:800 10px/1 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;transition:background .3s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.imo .imb i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#0b0a09;color:var(--or);font-style:normal;font-size:17px;font-weight:800;line-height:1;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.imo .imb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(240,89,42,.55);animation:imp 2.4s ease-out 2s infinite;pointer-events:none}
@keyframes imp{0%{box-shadow:0 0 0 0 rgba(240,89,42,.55)}70%,100%{box-shadow:0 0 0 14px rgba(240,89,42,0)}}
.wk.open .imb::after{animation:none}
.wk.open .imb i{transform:rotate(45deg)}
.im:hover .imb{transform:scale(1.05)}
.im:hover .imb i{transform:rotate(90deg)}.wk.open .im:hover .imb i{transform:rotate(135deg)}
.im:hover .imb{background:var(--tx)}
