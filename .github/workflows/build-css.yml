 const p=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,'')),d=p.get('error_description');
 if(!d)return;
 history.replaceState(null,'',location.pathname);takeFlag();
 open();setErr(errIn,'Sign-in failed: '+d.replace(/\+/g,' '))}
async function bootAuth(){
 if(!LIVE||authBooted)return;authBooted=true;
 try{
  const c=await loadSB();
  c.auth.onAuthStateChange((ev,ses)=>{
   const u=ses&&ses.user;
   if(u&&!allowed(u.email)){
    const wasFlow=takeFlag();setTimeout(()=>c.auth.signOut(),0);applyUser(null);
    if(wasFlow||H.classList.contains('ao')){open();setErr(errIn,authMsg({code:'denied'}))}
    return}
   applyUser(u||null);
   if(u&&ev==='SIGNED_IN'&&takeFlag())open()});
 }catch(e){authBooted=false}}

/* ---------- auth state ---------- */
function applyUser(u){
 user=u||null;H.classList.toggle('ain',!!user);
 q('#aMail').textContent=q('#aMail2').textContent=user?user.email:'';
 const lbl=user?'Open admin panel':'Admin login';
 ['#admBtn','#mmAdm'].forEach(s=>{const b=q(s);if(b)b.setAttribute('aria-label',lbl)});
 if(H.classList.contains('ao'))show(user?'Up':'In')}
function show(v){
 qa('.a-v').forEach(x=>x.classList.toggle('on',x.id==='v'+v));
 box.classList.toggle('wide',v==='Up'||v==='Mg');ov.scrollTop=0;
 qa('.a-tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===v))}
function setErr(el,msg){el.textContent=msg||'';el.classList.toggle('on',!!msg)}
function shake(){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake')}
function authMsg(e){
 const c=(e&&e.code)||'';
 if(c==='denied')return'This Google account is not authorized for admin access.';
 if(c==='net')return'Network error. Check your connection and try again.';
 return'Could not sign in. Please try again.'}

let redirecting=false;
async function signIn(){
 setErr(errIn,'');gg.classList.add('ld');
 try{
  if(!LIVE){await wait(1100);applyUser({email:'preview.admin@gmail.com'});toast('Signed in · preview mode');return}
  const c=await loadSB();
  try{sessionStorage.setItem(FLAG,'1')}catch(e){}
  const r=await c.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
  if(r.error)throw r.error;
  redirecting=true   // browser is now heading to Google; keep the spinner
 }catch(e){
  takeFlag();setErr(errIn,authMsg(e));shake()
 }finally{if(!redirecting)gg.classList.remove('ld')}}
addEventListener('pageshow',e=>{if(e.persisted){redirecting=false;gg.classList.remove('ld')}});
async function signOut(){
 if(busy)return;
 try{if(LIVE&&sb)await sb.auth.signOut()}catch(e){}
 applyUser(null);close(true);toast('Signed out')}

/* ---------- modal ---------- */
function open(){
 last=document.activeElement;
 const hb=q('#hb');if(H.classList.contains('mo')&&hb)hb.click();
 setErr(errIn,'');setErr(errUp,'');
 H.classList.add('ao');ov.setAttribute('aria-hidden','false');show(user?'Up':'In');
 qa('.a-mode').forEach(m=>m.classList.toggle('on',!LIVE));
 bootAuth();setTimeout(()=>box.focus({preventScroll:true}),80)}
function close(force){
 if(busy&&!force){toast('Upload in progress…');return}
 H.classList.remove('ao');ov.setAttribute('aria-hidden','true');
 if(last&&last.focus)last.focus({preventScroll:true})}
q('#admBtn').addEventListener('click',open);
q('#mmAdm').addEventListener('click',()=>{setTimeout(open,H.classList.contains('mo')?420:0)});
qa('[data-aclose]').forEach(b=>b.addEventListener('click',()=>close()));
ov.addEventListener('click',e=>{if(e.target===ov||e.target.id==='abg')close()});
// keep page-level handlers (smooth wheel scroll, gallery arrow keys) out of the modal
ov.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
ov.addEventListener('keydown',e=>{
 if(e.key==='Escape'){close();e.stopPropagation();return}
 if(e.key==='Tab'){
  const f=[...box.querySelectorAll('button,input,textarea,a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===box)){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
 e.stopPropagation()});
gg.addEventListener('click',signIn);
q('#aOut').addEventListener('click',signOut);q('#aOut2').addEventListener('click',signOut);

/* ---------- form helpers ---------- */
const fmt=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
function fErr(id,msg){const f=q('#'+id);f.classList.toggle('err',!!msg);const m=f.querySelector('.a-m');if(m)m.textContent=msg||''}
function clearAll(){['fFile','fTitle','fCat'].forEach(i=>fErr(i,''))}

function pickFile(f){
 if(!f)return;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)){fErr('fFile','Only JPG, PNG or WEBP images are allowed.');return}
 if(f.size>ADMIN.maxMB*1048576){fErr('fFile','Image is '+fmt(f.size)+' — the limit is '+ADMIN.maxMB+' MB.');return}
 fErr('fFile','');file=f;
 if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);
 th.src=objUrl;q('#aPvImg').src=objUrl;q('#aPvImg').alt=f.name;
 q('#aFn').textContent=f.name;q('#aFs').textContent=fmt(f.size);q('#aFe').textContent='';
 dz.classList.add('has');q('#aPi').classList.add('has');
 const im=new Image();im.onload=()=>{
  q('#aFs').textContent=fmt(f.size)+' · '+im.naturalWidth+'×'+im.naturalHeight;
  const r=im.naturalWidth/im.naturalHeight;q('#aFe').textContent=Math.abs(r-.75)>.06?'Will be cropped to 3:4':'3:4 · perfect fit'};
 im.src=objUrl;
 if(!iTitle.value.trim()){
  iTitle.value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase()).slice(0,80);syncPv()}}
function dropFile(){
 file=null;fi.value='';if(objUrl)URL.revokeObjectURL(objUrl);objUrl='';
 th.removeAttribute('src');q('#aPvImg').removeAttribute('src');
 dz.classList.remove('has');q('#aPi').classList.remove('has')}

fi.addEventListener('change',()=>{if(fi.files[0])pickFile(fi.files[0]);fi.value=''});
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','dragend'].forEach(t=>dz.addEventListener(t,()=>dz.classList.remove('drag')));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');pickFile(e.dataTransfer.files[0])});
q('#aRm').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();dropFile()});

